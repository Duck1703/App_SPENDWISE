# Gradle / build environment
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Spendwise API base URL (Human decision Q3: property-driven; real dev/prod URLs
# are deferred and supplied via -Pspendwise.api.base.url or SPENDWISE_API_BASE_URL).
# The committed default is a non-routable placeholder — the app must never
# silently target a real backend.
spendwise.api.base.url=https://example.invalid/
